name: Publish to container registries

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/**
      - Dockerfile
      - Dockerfile.debian
      - pyproject.toml
      - uv.lock
      - tests/test_container_image.py
      - .github/workflows/ci.yaml
      - .github/workflows/cd.yaml
  pull_request:
    paths:
      - src/**
      - Dockerfile
      - Dockerfile.debian
      - pyproject.toml
      - uv.lock
      - tests/test_container_image.py
      - .github/workflows/ci.yaml
      - .github/workflows/cd.yaml

jobs:
  docker-hub:
    name: Push ${{ matrix.flavor }} multi-arch image to Docker Hub
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: alpine
            dockerfile: Dockerfile
            target: ""
            base: docker.io/library/python:3.13-alpine
            latest: auto
            tags: |
              type=sha,format=short,prefix=commit-
              type=sha,format=short,prefix=commit-,suffix=-alpine
              type=ref,event=tag
              type=ref,event=tag,suffix=-alpine
          - flavor: debian
            dockerfile: Dockerfile.debian
            target: debian
            base: docker.io/library/python:3.13-slim-bookworm
            latest: false
            tags: |
              type=sha,format=short,prefix=commit-,suffix=-debian
              type=ref,event=tag,suffix=-debian
          - flavor: debian-node
            dockerfile: Dockerfile.debian
            target: debian-node
            base: docker.io/library/python:3.13-slim-bookworm
            latest: false
            tags: |
              type=sha,format=short,prefix=commit-,suffix=-debian-node
              type=ref,event=tag,suffix=-debian-node
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 #v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1

      - name: Extract ${{ matrix.flavor }} tags and labels for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: sparfenyuk/mcp-proxy
          tags: ${{ matrix.tags }}
          flavor: latest=${{ matrix.latest }}
          labels: |
            org.opencontainers.image.authors=Sergey Parfenyuk
            org.opencontainers.image.source=https://github.com/sparfenyuk/mcp-proxy
            org.opencontainers.image.url=https://github.com/sparfenyuk/mcp-proxy
            org.opencontainers.image.title=mcp-proxy
            org.opencontainers.image.description=Connect to MCP servers that run on SSE transport, or expose stdio servers as an SSE server using the MCP Proxy server.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.base.name=${{ matrix.base }}
            io.mcp-proxy.container.flavor=${{ matrix.flavor }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.flavor }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.flavor }}
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.flavor }}

      - name: Clean Docker cache
        if: github.event_name != 'pull_request'
        run: |
          docker system prune --force

  ghcr-io:
    name: Push ${{ matrix.flavor }} multi-arch image to ghcr.io
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: alpine
            dockerfile: Dockerfile
            target: ""
            base: docker.io/library/python:3.13-alpine
            latest: auto
            tags: |
              type=sha,format=short,prefix=commit-
              type=sha,format=short,prefix=commit-,suffix=-alpine
              type=ref,event=tag
              type=ref,event=tag,suffix=-alpine
          - flavor: debian
            dockerfile: Dockerfile.debian
            target: debian
            base: docker.io/library/python:3.13-slim-bookworm
            latest: false
            tags: |
              type=sha,format=short,prefix=commit-,suffix=-debian
              type=ref,event=tag,suffix=-debian
          - flavor: debian-node
            dockerfile: Dockerfile.debian
            target: debian-node
            base: docker.io/library/python:3.13-slim-bookworm
            latest: false
            tags: |
              type=sha,format=short,prefix=commit-,suffix=-debian-node
              type=ref,event=tag,suffix=-debian-node
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 #v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4.4.1

      - name: Extract ${{ matrix.flavor }} tags and labels for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/sparfenyuk/mcp-proxy
          tags: ${{ matrix.tags }}
          flavor: latest=${{ matrix.latest }}
          labels: |
            org.opencontainers.image.authors=Sergey Parfenyuk
            org.opencontainers.image.source=https://github.com/sparfenyuk/mcp-proxy
            org.opencontainers.image.url=https://github.com/sparfenyuk/mcp-proxy
            org.opencontainers.image.title=mcp-proxy
            org.opencontainers.image.description=Connect to MCP servers that run on SSE transport, or expose stdio servers as an SSE server using the MCP Proxy server.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.base.name=${{ matrix.base }}
            io.mcp-proxy.container.flavor=${{ matrix.flavor }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.flavor }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ matrix.flavor }}
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ matrix.flavor }}

      - name: Clean Docker cache
        if: github.event_name != 'pull_request'
        run: |
          docker system prune --force
